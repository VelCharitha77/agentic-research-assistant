<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Agentic Research Assistant</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
  input, button { font-size: 1rem; padding: 8px; }
  input { width: 65%; }
  button { cursor: pointer; }
  #log { margin-top: 16px; font-family: monospace; color: #555; min-height: 1.5em; }
  #log div { padding: 2px 0; }
  #result { white-space: pre-wrap; margin-top: 20px; padding: 16px; background: #f5f5f5; border-radius: 6px; }
</style>
</head>
<body>
  <h1>Agentic Research Assistant</h1>
  <input id="topic" placeholder="Enter a topic..." value="the history of the printing press">
  <button onclick="startRun()">Start</button>
  <div id="log"></div>
  <div id="result"></div>

  <script>
    const labels = {
      research: "Researching...",
      draft: "Drafting...",
      critique: "Critiquing...",
      revise: "Revising...",
      finalize: "Finalizing...",
      failed: "Research failed."
    };

    async function startRun() {
      const topic = document.getElementById("topic").value;
      const log = document.getElementById("log");
      const result = document.getElementById("result");
      log.innerHTML = "";
      result.textContent = "";

      const createResponse = await fetch("/runs", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ topic })
      });
      const { run_id } = await createResponse.json();

      const source = new EventSource(`/runs/${run_id}/stream`);

      source.onmessage = (e) => {
        const data = JSON.parse(e.data);
        let text = labels[data.node] || data.node;
        if (data.revision_count !== undefined) {
          text += ` (revision ${data.revision_count})`;
        }
        const line = document.createElement("div");
        line.textContent = text;
        log.appendChild(line);
      };

      source.addEventListener("done", async () => {
        source.close();
        const final = await fetch(`/runs/${run_id}`).then((r) => r.json());
        result.textContent =
          final.status === "completed" ? final.final_document : "Error: " + final.error;
      });
    }
  </script>
</body>
</html>
