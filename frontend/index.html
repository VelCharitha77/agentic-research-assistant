<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Agentic Research Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Metamorphous&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bark-dark: #2b1d12;
    --bark-mid: #4a3320;
    --bark-light: #5c4128;
    --beige: #ead9b8;
    --parchment: #efe3c8;
    --parchment-dark: #ddcda3;
    --ink: #3b2a1a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Crimson Text", Georgia, serif;
    color: var(--ink);
    background-color: var(--bark-dark);
    background-image:
      repeating-linear-gradient(4deg, rgba(0,0,0,0.18) 0px, rgba(0,0,0,0.18) 2px, transparent 2px, transparent 9px),
      repeating-linear-gradient(-3deg, rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 1px, transparent 1px, transparent 14px),
      repeating-linear-gradient(2deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 6px),
      radial-gradient(ellipse at center, var(--bark-light) 0%, var(--bark-mid) 55%, var(--bark-dark) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
    position: relative;
    
  }

  .vine-corner {
    position: fixed;
    width: 170px;
    height: auto;
    pointer-events: none;
    z-index: 0;
    filter: drop-shadow(0 2px 5px rgba(0,0,0,0.45));
  }
  .vine-corner--bl { bottom: -16px; left: -12px; }
  .vine-corner--tr { top: -16px; right: -12px; transform: rotate(180deg); }

  .panel {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 640px;
    background: var(--parchment);
    background-image: repeating-linear-gradient(90deg, rgba(0,0,0,0.02) 0px, transparent 2px, transparent 4px);
    border: 6px solid var(--bark-mid);
    border-radius: 4px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.55), inset 0 0 60px rgba(90,60,20,0.15);
    padding: 32px 36px 40px;
  }

  h1 {
    font-family: "Metamorphous", serif;
    font-weight: 400;
    text-align: center;
    color: var(--beige);
    background: var(--bark-mid);
    margin: -32px -36px 28px;
    padding: 22px 20px;
    border-bottom: 4px solid var(--bark-dark);
    text-shadow: 0 2px 3px rgba(0,0,0,0.6), 0 0 18px rgba(234,217,184,0.25);
    letter-spacing: 0.03em;
    font-size: 1.9rem;
  }

  .controls { display: flex; gap: 10px; }

  input {
    flex: 1;
    font-family: "Crimson Text", Georgia, serif;
    font-size: 1.05rem;
    padding: 10px 14px;
    background: var(--parchment-dark);
    border: 2px solid var(--bark-mid);
    border-radius: 3px;
    color: var(--ink);
  }
  input::placeholder { color: #8a7654; font-style: italic; }

  button {
    font-family: "Metamorphous", serif;
    font-size: 0.95rem;
    padding: 10px 22px;
    cursor: pointer;
    color: var(--beige);
    background: linear-gradient(180deg, var(--bark-light), var(--bark-mid));
    border: 2px solid var(--bark-dark);
    border-radius: 3px;
    transition: filter 0.15s ease;
  }
  button:hover { filter: brightness(1.15); }

  #log {
    margin-top: 20px;
    font-family: "Crimson Text", Georgia, serif;
    font-style: italic;
    color: #6b5638;
    min-height: 1.5em;
  }
  #log div { padding: 3px 0; }

  #result {
    white-space: pre-wrap;
    margin-top: 22px;
    padding: 20px 22px;
    background: var(--parchment-dark);
    border: 2px solid var(--bark-mid);
    border-radius: 3px;
    line-height: 1.55;
  }
</style>
</head>
<body>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <path id="vine-leaf" d="M0,0 C6,-5 16,-5 22,0 C16,5 6,5 0,0 Z"/>
      <path id="vine-tendril" d="M0,0 C4,-3 5,-9 1,-11 C-3,-13 -7,-9 -5,-5 C-3,-2 1,-1 2,-4" fill="none" stroke-width="2.2" stroke-linecap="round"/>
      <g id="vine-motif">
        <path d="M20,326 C58,282 2,242 42,200 C82,158 12,140 52,98 C90,68 42,40 82,8"
              fill="none" stroke="#4a5f2e" stroke-width="5" stroke-linecap="round"/>
        <use href="#vine-tendril" transform="translate(46,193)" stroke="#4a5f2e"/>
        <use href="#vine-tendril" transform="translate(58,103) scale(-1,1)" stroke="#4a5f2e"/>
        <use href="#vine-leaf" transform="translate(40,256) rotate(-115) scale(1.2)" fill="#4f7a34"/>
        <use href="#vine-leaf" transform="translate(10,220) rotate(55) scale(1.1)" fill="#6b9c47"/>
        <use href="#vine-leaf" transform="translate(54,176) rotate(-125) scale(1.25)" fill="#3d5f28"/>
        <use href="#vine-leaf" transform="translate(18,146) rotate(50) scale(1.1)" fill="#6b9c47"/>
        <use href="#vine-leaf" transform="translate(64,110) rotate(-120) scale(1.2)" fill="#4f7a34"/>
        <use href="#vine-leaf" transform="translate(33,76) rotate(60) scale(1.1)" fill="#3d5f28"/>
        <use href="#vine-leaf" transform="translate(68,46) rotate(-110) scale(1.15)" fill="#6b9c47"/>
        <use href="#vine-leaf" transform="translate(83,20) rotate(45) scale(1.1)" fill="#4f7a34"/>
      </g>
    </defs>
  </svg>

  <svg class="vine-corner vine-corner--bl" viewBox="0 0 100 330" aria-hidden="true">
    <use href="#vine-motif"/>
  </svg>
  <svg class="vine-corner vine-corner--tr" viewBox="0 0 100 330" aria-hidden="true">
    <use href="#vine-motif"/>
  </svg>

  <div class="panel">
    <h1>Agentic Research Assistant</h1>
    <div class="controls">
      <input id="topic" placeholder="Enter a topic..." value="the history of the printing press">
      <button onclick="startRun()">Start</button>
    </div>
    <div id="log"></div>
    <div id="result"></div>
  </div>

  <script>
    const labels = {
      research: "Researching...",
      draft: "Drafting...",
      critique: "Critiquing...",
      revise: "Revising...",
      finalize: "Finalizing...",
      failed: "Research failed."
    };

    async function startRun() {
      const topic = document.getElementById("topic").value;
      const log = document.getElementById("log");
      const result = document.getElementById("result");
      log.innerHTML = "";
      result.textContent = "";

      const createResponse = await fetch("/runs", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ topic })
      });
      const { run_id } = await createResponse.json();

      const source = new EventSource(`/runs/${run_id}/stream`);

      source.onmessage = (e) => {
        const data = JSON.parse(e.data);
        let text = labels[data.node] || data.node;
        if (data.revision_count !== undefined) {
          text += ` (revision ${data.revision_count})`;
        }
        const line = document.createElement("div");
        line.textContent = text;
        log.appendChild(line);
      };

      source.addEventListener("done", async () => {
        source.close();
        const final = await fetch(`/runs/${run_id}`).then((r) => r.json());
        result.textContent =
          final.status === "completed" ? final.final_document : "Error: " + final.error;
      });
    }
  </script>
</body>
</html>
